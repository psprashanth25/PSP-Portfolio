  <text x="50" y="60" font-family="'Outfit', 'Inter', -apple-system, sans-serif" font-size="34" font-weight="900" fill="url(#pspGrad)" text-anchor="middle" letter-spacing="-1" filter="url(#glow)">PSP</text>
